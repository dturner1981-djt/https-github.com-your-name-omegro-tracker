# Turner Group — business units, owners and thresholds.
# Group Leader: David Turner (Nelson Portfolio, Omegro).
#
# `key` is the stable internal id used everywhere in the pipeline.
# `aliases` are the spellings these businesses appear under in source
# workbooks — BPC entity names, ITDS assessment filenames and QSR packs all
# differ, so matching is done on the alias list rather than the display name.

group:
  name: Turner Group
  portfolio: Nelson Portfolio
  operating_group: Omegro
  group_leader: David Turner
  portfolio_cfo: Renuka Simpson
  # BPC reports this group as "David Turner Group" in USD, even though every
  # unit's functional currency is GBP. The dashboard reports in the group
  # reporting currency so the units add up; each unit's own currency is below.
  reporting_currency: USD
  bpc_group: David Turner Group
  # Finance contacts who produce and sign off the numbers this tool reads.
  finance_contacts: [Stephen Craig, Renuka Simpson, Jean Triquet]
  # Volaris/Omegro reporting runs on calendar quarters.
  fiscal_year_start_month: 1
  # Where the published dashboard lives. The weekly alert links here, so it
  # must be the URL that always shows the latest refresh.
  dashboard_url: https://claude.ai/artifact/1RwvApQs22cdZJW8sGZTye

alerts:
  # Monday morning source scan. Cron is UTC, so this is 08:00 London in
  # summer and 07:00 in winter — both "Monday morning", no DST handling.
  cron: "0 7 * * 1"
  recipients: [david.turner@omegro.com]
  # Send even when nothing changed, so silence always means the scan did not
  # run rather than that there was nothing to say.
  send_when_unchanged: true

business_units:
  - key: tbl
    name: Technology Blueprint
    short_name: TBL
    aliases: ["TBL", "Technology Blueprint", "Technology Blueprint Ltd", "Technology Blueprint Limited", "Technology Blueprint Consolidated", "M_TBLCONS", "E_TECHB"]
    country: United Kingdom
    currency: GBP
    products: ["PropCo Enterprise", "PropCo Web"]
    leader: Colin Ma
    reports: [pnl, working_capital]

  - key: tlm
    name: tlmNexus
    short_name: TLM
    aliases: ["tlmNexus", "TLM Nexus", "tlmNexus Ltd", "TlmNexus Ltd", "M_TLMN", "TLM"]
    country: United Kingdom
    currency: GBP
    products: ["Observe", "Asset Management"]
    leader: David Appleton
    reports: [pnl, working_capital]

  - key: grosvenor
    name: Grosvenor Systems
    short_name: Grosvenor
    aliases: ["Grosvenor", "Grosvenor Systems", "Grosvenor Systems Limited", "Grosvenor Consolidated", "M_GROSVCONSOL", "GROSV", "E_GROSV"]
    country: United Kingdom
    currency: GBP
    products: ["Propman", "Progress Maintenance"]
    leader: Paula McQuilan
    reports: [pnl, working_capital]

  # BPC's "David Turner Group" row band still carries AgentOS. It is leaving
  # the group, so it is out of scope: its figures are dropped on load and
  # never reach the snapshot, the totals or the page. The entry stays only so
  # the alias keeps matching — otherwise its rows would be silently mistaken
  # for an unrecognised unit when BPC is slow to drop the band.
  - key: agentos
    name: AgentOS
    short_name: AgentOS
    aliases: ["AgentOS", "Agent OS", "M_AGENTOS"]
    country: United Kingdom
    currency: GBP
    leader: null
    in_scope: false
    out_of_scope_reason: Divesting — excluded from the group from 2026-09.
    reports: [pnl]

# Volaris standard metrics. `direction` says which way is good; the RAG bands
# below are read against variance-to-forecast unless `absolute` is set.
metrics:
  net_revenue:
    label: Net Revenue
    unit: kGBP
    direction: higher
  ebita:
    label: EBITA
    unit: kGBP
    direction: higher
  opex:
    label: OPEX
    unit: kGBP
    direction: lower
  ebita_pct:
    label: EBITA %
    unit: pct
    direction: higher
  og_pct:
    label: Organic Growth %
    unit: pct
    direction: higher
  bqr_pct:
    label: BQR %
    unit: pct
    direction: higher
  wc_pct:
    label: Working Capital %
    unit: pct
    direction: lower
  wc_pct_ex_cash:
    label: WC % (excl. cash)
    unit: pct
    direction: lower
  bookings:
    label: Bookings
    unit: kGBP
    direction: higher
  overdue_ar_pct:
    label: Overdue AR %
    unit: pct
    direction: lower
  wip_over_30_pct:
    label: WIP > 30 days %
    unit: pct
    direction: lower

# Variance to forecast. The Monthly Review Template calls anything beyond
# +/-5% material and requiring commentary, so that is the amber gate.
rag:
  variance_pct:
    on_track: 0.05      # |var| <= 5%
    at_risk: 0.10       # |var| <= 10%, else off track
  # Absolute gates for metrics judged against a standard, not a forecast.
  absolute:
    wc_pct: { on_track: 0.10, at_risk: 0.20 }
    ebita_pct: { on_track: 0.20, at_risk: 0.10, direction: higher }

# Operational Governance stages, best to worst. Drives the governance pane.
og_stages: [Invest, Grow, Monitor, Take Action, Escalation]

# The Operational Governance framework itself, as published — not scores.
#
# Source: Katie Mansell (CFO, Omegro) to DG Omegro Senior Leadership Team,
# "Operational Governance Framework – Adding IT & Data Security from Q3-26",
# 14 September 2026. Quoted rather than summarised wherever it sets a rule,
# because these bands decide whether a business is escalated.
#
# This block is the FRAMEWORK. The per-BU dimension scores and the resulting
# stage live in the quarterly scorecard workbook and are not reproduced here.
# The one dimension the tracker can compute for itself is ITDS, because the
# QDSR score it is scored from is already parsed from the Q2 validation
# assessment — so that column is derived, and the other four stay blank until
# the workbook is read.
og_framework:
  source: >
    Katie Mansell (CFO), "Operational Governance Framework – Adding IT & Data
    Security from Q3-26", 14 Sep 2026, to DG Omegro Senior Leadership Team.
  dimensions: [Financial, Leadership, Operational, Talent & Capability, IT & Data Security]
  # Each of the original four dimensions is scored out of 6 (36 total). ITDS
  # takes the total to 42 — but not yet: see `itds_dimension` below.
  points_per_dimension: 6
  points_max_before: 36
  points_max_after: 42
  itds_dimension:
    # Published Q3-26: visible alongside the scorecard, no effect on stage.
    published_from: 2026-Q3
    # Q4-26: contributes to the stage calculation, "with stage thresholds
    # adjusted proportionally".
    counts_from: 2026-Q4
    # Scored from the QDSR security maturity score (same 0-400 scale the
    # Portfolio Security Assessment publishes; lower is better).
    scored_from: qdsr
    target: 80
    # `range` is the band as the CFO wrote it and is what the page shows;
    # `max` is what the code compares against. They disagree at exactly 200,
    # because the published Red and Black bands both claim it — which is
    # where Grosvenor sits. Keeping the published wording verbatim is the
    # point: the overlap is real and belongs in front of the reader.
    bands:
      - { name: Green,  max: 80,   points: 6, range: "≤80" }
      - { name: Amber,  max: 160,  points: 4, range: "81–160" }
      - { name: Red,    max: 200,  points: 2, range: "161–200" }
      - { name: Black,  max: null, points: 0, range: "200+" }
    escalation:
      # "Auto-escalation applies from Q3-26 regardless of overall score."
      from: 2026-Q3
      # Limb one is unambiguous and computable.
      qdsr_at_or_above: 160
      # Limb two names two controls but not the test that decides a failure.
      # The QDSR key-area ratings are the nearest published equivalent, so a
      # `critical` rating on either is treated as MEETING THE LIMB ON ITS FACE
      # and flagged for confirmation — never asserted as an escalation on its
      # own. See `governance.py`.
      critical_control_areas: ["IAM & MFA", "Detection & Response"]

# ITDS Portfolio Security Assessment: risk score out of 400, lower is better.
itds:
  max_score: 400
  postures:
    Strong: good
    Moderate: warning
    Needs Improvement: serious
    Critical: critical
  # Control scoring: each of 50 controls scored 0-10; <7 is the focus population.
  control_count: 50
  focus_threshold: 7
